<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aircraft Exam Timer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>

<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #f4f5f7; color: #111; }
header { background: #111; color: white; padding: 18px 24px; display: flex; justify-space-between: space-between; align-items: center; }
header h1 { margin: 0; font-size: 24px; }
.room-display { font-size: 18px; font-weight: bold; }
.room-code { background: white; color: black; padding: 7px 12px; border-radius: 8px; letter-spacing: 4px; margin-left: 5px; }
main { padding: 20px; max-width: 1400px; margin: auto; }
.top-controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
button { border: none; border-radius: 9px; padding: 12px 16px; font-weight: bold; cursor: pointer; background: #111; color: white; }
button:hover { opacity: 0.85; }
button.secondary { background: #e5e7eb; color: #111; }
button.danger { background: #b91c1c; }
.connection-status { background: #e5e7eb; padding: 12px 16px; border-radius: 9px; font-weight: bold; }
.participants-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; }
.participant { background: white; border: 1px solid #ddd; border-radius: 14px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.participant-name-input { font-size: 18px; font-weight: bold; margin-bottom: 10px; width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; }
.stage { text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 10px; }
.timer { font-size: 48px; font-weight: bold; text-align: center; padding: 18px 5px; border-radius: 10px; margin-bottom: 12px; }
.timer-open { background: #e8f4ff; }
.timer-closed { background: #fff3cd; }
.timer-aircraft { background: #e8f5e9; }
.timer-done { background: #eeeeee; }
.participant-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.participant-controls button:last-child { grid-column: 1 / -1; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
.modal.show { display: flex; }
.modal-card { background: white; border-radius: 18px; padding: 28px; width: 100%; max-width: 420px; }
.modal-card input { width: 100%; padding: 15px; font-size: 25px; text-align: center; letter-spacing: 5px; border: 1px solid #aaa; border-radius: 9px; margin: 12px 0; }
#remoteView { display: none; }
.small-text { color: #666; font-size: 13px; }
@media (max-width: 600px) {
header { padding: 14px; }
header h1 { font-size: 19px; }
.room-display { font-size: 13px; }
main { padding: 12px; }
.participants-grid { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.timer { font-size: 36px; padding: 10px 5px; }
}
</style>
</head>
<body>

<header>
<h1>Aircraft Exam Timer</h1>
<div class="room-display">ROOM: <span class="room-code" id="roomCodeDisplay">----</span></div>
</header>

<main id="laptopView">
<div class="top-controls">
<button onclick="createRoom()">Create New Room</button>
<button class="secondary" onclick="openJoinModal()">Join Existing Room</button>
<button onclick="addParticipant()">+ Add Participant</button>
<button onclick="startAllOpen()">▶ Start Open For All</button>
<div class="connection-status" id="connectionStatus">Creating room...</div>
</div>
<div id="participants" class="participants-grid"></div>
</main>

<main id="remoteView">
<div class="top-controls">
<button onclick="remoteCommand('startAll')">▶ Start Open For All</button>
<button class="secondary" onclick="remoteCommand('add')">+ Add Participant</button>
<button class="danger" onclick="disconnectRemote()">Disconnect</button>
<div class="connection-status" id="remoteStatus">Connecting...</div>
</div>
<div id="remoteParticipants" class="participants-grid"></div>
</main>

<div class="modal" id="joinModal">
<div class="modal-card">
<h2>Join Classroom</h2>
<p>Enter the 4-digit room code shown on the laptop.</p>
<input id="roomInput" maxlength="4" inputmode="numeric" placeholder="4821">
<button style="width:100%" onclick="joinRoom()">JOIN ROOM</button>
<button class="secondary" style="width:100%; margin-top:8px" onclick="closeJoinModal()">Cancel</button>
<p class="small-text" id="joinMessage"></p>
</div>
</div>

<script>
const OPEN_SECONDS = 15 * 60;
const CLOSED_SECONDS = 15 * 60;
const AIRCRAFT_SECONDS = 30 * 60;
const MAX_PARTICIPANTS = 22;

/* Free Open TURN/STUN Relay Server Config to Bypass Firewalls */
const PEER_CONFIG = {
config: {
iceServers: [
{ urls: 'stun:stun.l.google.com:19302' },
{ urls: 'stun:stun1.l.google.com:19302' },
{
urls: 'turn:openrelay.metered.ca:80',
username: 'openrelay',
credential: 'openrelay'
},
{
urls: 'turn:openrelay.metered.ca:443',
username: 'openrelay',
credential: 'openrelay'
},
{
urls: 'turn:openrelay.metered.ca:443?transport=tcp',
username: 'openrelay',
credential: 'openrelay'
}
]
}
};

let participants = [];
let nextParticipantID = 1;
let roomCode = "";
let hostPeer = null;
let remotePeer = null;
let remoteConnection = null;
let remoteConnections = [];

function generateRoomCode() {
return String(Math.floor(1000 + Math.random() * 9000));
}

function setRoomCode(code) {
roomCode = code;
document.getElementById("roomCodeDisplay").textContent = code;
}

function createRoom() {
if (hostPeer) { try { hostPeer.destroy(); } catch(e) {} }
const code = generateRoomCode();
setRoomCode(code);

document.getElementById("connectionStatus").textContent = "Connecting...";

hostPeer = new Peer("aircraft-timer-" + code, PEER_CONFIG);

hostPeer.on("open", function() {
document.getElementById("connectionStatus").textContent = "Room ready — phone can join";
});

hostPeer.on("connection", function(connection) {
remoteConnections.push(connection);
connection.on("open", function() {
connection.send({ type: "state", state: collectState() });
});
connection.on("data", function(data) { handleRemoteCommand(data); });
connection.on("close", function() {
remoteConnections = remoteConnections.filter(c => c !== connection);
});
});

hostPeer.on("error", function(err) {
document.getElementById("connectionStatus").textContent = "Error. Click 'Create New Room'.";
});
}

function openJoinModal() {
document.getElementById("joinModal").classList.add("show");
document.getElementById("roomInput").focus();
}

function closeJoinModal() {
document.getElementById("joinModal").classList.remove("show");
}

function joinRoom() {
const code = document.getElementById("roomInput").value.trim();
if (!/^\d{4}$/.test(code)) {
document.getElementById("joinMessage").textContent = "Enter a 4-digit room code.";
return;
}

document.getElementById("joinMessage").textContent = "Connecting via relay...";

remotePeer = new Peer(PEER_CONFIG);

remotePeer.on("open", function() {
remoteConnection = remotePeer.connect("aircraft-timer-" + code, { reliable: true });

remoteConnection.on("open", function() {
document.getElementById("laptopView").style.display = "none";
document.getElementById("remoteView").style.display = "block";
document.getElementById("remoteStatus").textContent = "Connected to Room " + code;
closeJoinModal();
});

remoteConnection.on("data", function(data) {
if (data.type === "state") renderRemote(data.state);
});

remoteConnection.on("close", function() {
document.getElementById("remoteStatus").textContent = "Disconnected";
});
});

remotePeer.on("error", function(err) {
document.getElementById("joinMessage").textContent = "Could not connect. Check the code.";
});
}

function addParticipant() {
if (participants.length >= MAX_PARTICIPANTS) return alert("Maximum reached.");
participants.push({
id: nextParticipantID++,
name: "Participant " + (participants.length + 1),
stage: "READY",
seconds: 0,
running: false,
interval: null
});
renderLaptop();
broadcastState();
}

function updateParticipantName(id, newName) {
const p = participants.find(x => x.id === id);
if (p) { p.name = newName; broadcastState(); }
}

function disableParticipant(id) {
const p = participants.find(x => x.id === id);
if (!p) return;
clearInterval(p.interval);
p.running = false;
p.stage = "DISABLED";
p.seconds = 0;
renderLaptop();
broadcastState();
}

function startAllOpen() {
participants.forEach(p => {
if (p.stage === "DISABLED") return;
startStage(p.id, OPEN_SECONDS, "OPEN", () => {
startStage(p.id, CLOSED_SECONDS, "CLOSED", () => {
startStage(p.id, AIRCRAFT_SECONDS, "AIRCRAFT", () => {
const item = participants.find(x => x.id === p.id);
if (item) { item.stage = "DONE"; item.seconds = 0; item.running = false; }
renderLaptop();
broadcastState();
});
});
});
});
}

function startStage(id, duration, stage, callback) {
const p = participants.find(x => x.id === id);
if (!p || p.stage === "DISABLED") return;
clearInterval(p.interval);
p.stage = stage;
p.seconds = duration;
p.running = true;
renderLaptop();
broadcastState();

p.interval = setInterval(() => {
p.seconds = Math.max(0, p.seconds - 1);
renderLaptop();
broadcastState();
if (p.seconds <= 0) {
clearInterval(p.interval);
p.running = false;
if (callback) callback();
else { p.stage = "DONE"; renderLaptop(); broadcastState(); }
}
}, 1000);
}

function formatTime(s) {
const m = Math.floor(s / 60);
const sec = s % 60;
return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
}

function renderLaptop() {
const container = document.getElementById("participants");
container.innerHTML = "";
participants.forEach(p => {
const card = document.createElement("div");
card.className = "participant";
let timerClass = p.stage === "OPEN" ? "timer-open" : p.stage === "CLOSED" ? "timer-closed" : p.stage === "AIRCRAFT" ? "timer-aircraft" : "timer-done";
let timerText = (p.stage === "DISABLED") ? "DISABLED" : (p.stage === "DONE") ? "DONE" : (p.stage === "READY") ? "--:--" : formatTime(p.seconds);

card.innerHTML = `
<input type="text" class="participant-name-input" value="${escapeHTML(p.name)}" onchange="updateParticipantName(${p.id}, this.value)" />
<div class="stage">${p.stage}</div>
<div class="timer ${timerClass}">${timerText}</div>
<div class="participant-controls">
<button onclick="startStage(${p.id}, ${CLOSED_SECONDS}, 'CLOSED')">CLOSED</button>
<button onclick="startStage(${p.id}, ${AIRCRAFT_SECONDS}, 'AIRCRAFT')">AIRCRAFT</button>
<button class="danger" onclick="disableParticipant(${p.id})">Disable</button>
</div>`;
container.appendChild(card);
});
}

function collectState() {
return participants.map(p => ({ id: p.id, name: p.name, stage: p.stage, seconds: p.seconds, running: p.running }));
}

function broadcastState() {
const msg = { type: "state", state: collectState() };
remoteConnections = remoteConnections.filter(c => c.open);
remoteConnections.forEach(c => { try { c.send(msg); } catch(e){} });
}

function remoteCommand(cmd, id, val) {
if (!remoteConnection || !remoteConnection.open) return;
remoteConnection.send({ type: "command", command: cmd, id: id, value: val });
}

function handleRemoteCommand(data) {
if (!data || data.type !== "command") return;
if (data.command === "startAll") startAllOpen();
else if (data.command === "add") addParticipant();
else if (data.command === "updateName") { updateParticipantName(data.id, data.value); renderLaptop(); }
else if (data.command === "closed") startStage(data.id, CLOSED_SECONDS, "CLOSED");
else if (data.command === "aircraft") startStage(data.id, AIRCRAFT_SECONDS, "AIRCRAFT");
else if (data.command === "disable") disableParticipant(data.id);
}

function renderRemote(state) {
if (document.activeElement && document.activeElement.classList.contains("participant-name-input")) return;
const container = document.getElementById("remoteParticipants");
container.innerHTML = "";
state.forEach(p => {
const card = document.createElement("div");
card.className = "participant";
let timerClass = p.stage === "OPEN" ? "timer-open" : p.stage === "CLOSED" ? "timer-closed" : p.stage === "AIRCRAFT" ? "timer-aircraft" : "timer-done";
let timerText = (p.stage === "DISABLED") ? "DISABLED" : (p.stage === "DONE") ? "DONE" : (p.stage === "READY") ? "--:--" : formatTime(p.seconds);

card.innerHTML = `
<input type="text" class="participant-name-input" value="${escapeHTML(p.name)}" onchange="remoteCommand('updateName', ${p.id}, this.value)" />
<div class="stage">${p.stage}</div>
<div class="timer ${timerClass}">${timerText}</div>
<div class="participant-controls">
<button onclick="remoteCommand('closed', ${p.id})">CLOSED</button>
<button onclick="remoteCommand('aircraft', ${p.id})">AIRCRAFT</button>
<button class="danger" onclick="remoteCommand('disable', ${p.id})">Disable</button>
</div>`;
container.appendChild(card);
});
}

function disconnectRemote() {
if (remoteConnection) remoteConnection.close();
location.reload();
}

function escapeHTML(str) {
return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
}

createRoom();
</script>
</body>
</html>
